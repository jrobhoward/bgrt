[workspace]
resolver = "3"
members = ["crates/bgrt", "crates/bgrt-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
repository = "https://github.com/jrobhoward/bgrt"
homepage = "https://github.com/jrobhoward/bgrt"
keywords = ["tokio", "scheduler", "energy", "efficiency", "background"]
categories = ["asynchronous", "concurrency"]

[workspace.lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Internal crates
bgrt = { path = "crates/bgrt", version = "0.1.0" }

# Async runtime we wrap (Phase 2+)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

# Parallel iterator library (optional bgrt feature)
rayon = "1"

# Error handling / concurrency / logging
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Harness (Phase 5)
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform FFI
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }

# Dev
rstest = "0.26"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
