name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mondays 06:00 UTC — drives the `fresh-deps` job below, which is the only
  # thing here that resolves dependencies afresh.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# Windows runners default to pwsh; bash is present on all three and keeps every
# `run:` block identical across the matrix.
defaults:
  run:
    shell: bash

jobs:
  # The point of the matrix: `backend/{macos,linux,windows}.rs` and their tests
  # are cfg-gated, so each OS is the *only* place its backend actually executes.
  # Cross-compiling (as done locally) proves it type-checks, not that it works.
  #
  # The two `-arm` labels extend that to aarch64. The syscalls the Linux backend
  # issues go through `libc::SYS_*` rather than hardcoded numbers, so the
  # architecture is right by construction — but until these runners existed, no
  # `ioprio_set` or `sched_setattr` from this crate had ever run on anything but
  # x86_64. `macos-latest` is already Apple silicon, so it covers the third.
  # These are cloud VMs: they execute the backends, they cannot measure them
  # (homogeneous vCPUs, no `cpu_capacity`, no cpufreq, no RAPL).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      # What the runner actually is. GitHub can change the hardware behind a
      # label without notice, and `topology.rs` reads exactly these files, so a
      # log of them is the evidence for whether any runner is heterogeneous.
      # Diagnostic only: a missing tool or sysfs path must never fail the job.
      - name: Runner CPU probe
        continue-on-error: true
        run: |
          set +e
          echo "== uname"; uname -a
          case "${{ runner.os }}" in
            Linux)
              echo "== lscpu"; lscpu | head -25
              echo "== MIDR (arm64 implementer/part)"
              grep -E 'CPU implementer|CPU part|model name' /proc/cpuinfo | sort -u
              echo "== cpu_capacity (heterogeneity: differing values = big.LITTLE)"
              grep . /sys/devices/system/cpu/cpu*/cpu_capacity 2>/dev/null || echo absent
              echo "== hybrid PMU (Intel cpu_atom)"
              cat /sys/bus/event_source/devices/cpu_atom/cpus 2>/dev/null || echo absent
              echo "== cpufreq governor"
              cat /sys/devices/system/cpu/cpufreq/policy*/scaling_governor 2>/dev/null || echo absent
              echo "== RAPL"; ls /sys/class/powercap 2>/dev/null || echo absent
              echo "== block scheduler (loop devices filtered out)"
              grep . /sys/block/*/queue/scheduler 2>/dev/null | grep -v '/loop' | head -5 || echo absent
              ;;
            macOS)
              sysctl -n machdep.cpu.brand_string
              echo "== perflevels (perflevel1 present = heterogeneous)"
              sysctl hw.ncpu hw.nperflevels hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu 2>/dev/null
              ;;
            Windows)
              powershell -Command "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List"
              ;;
          esac
          exit 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # `-- -Dwarnings` applies to workspace members only (not dependencies), so
      # a warning introduced by a new stable release upstream can't break CI.
      # It also promotes the crate's own `#![warn(missing_docs)]` and the
      # workspace `unwrap_used`/`expect_used`/`cognitive_complexity` lints.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -Dwarnings

      # Includes bgrt-bench's end-to-end test and the rustdoc doctests.
      - name: Test (default features)
        run: cargo test --workspace --locked

      # Feature permutations run on every OS because the code they gate is
      # itself per-OS: e.g. `--no-default-features` exercises each backend with
      # no tokio in the tree at all.
      - name: Test (no default features — no tokio, no rayon)
        run: cargo test -p bgrt --no-default-features --locked

      - name: Test (rayon)
        run: cargo test -p bgrt --features rayon --locked

      - name: Test (telemetry)
        run: cargo test -p bgrt --features telemetry --locked

      - name: Test (all features)
        run: cargo test -p bgrt --all-features --locked

      # The same question as the probe above, answered by the crate's own
      # detection instead of by raw sysfs: `%E` reads `n/a` exactly when
      # `topology` found no heterogeneity, and a number when it found some.
      # A debug build is fine — this run is read for its telemetry columns, not
      # its throughput.
      - name: Topology as bgrt detects it
        continue-on-error: true
        run: cargo run -p bgrt-bench --locked -- --duration 0.5 --interval 20 --executors default,background

  # Guards `rust-version = "1.85.0"`. Matrixed because an MSRV violation could
  # sit in a cfg-gated backend that only compiles on its own OS.
  msrv:
    name: msrv 1.85.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-msrv-cargo-

      - name: Check
        run: cargo check --workspace --all-features --locked

  # Every other job runs `--locked`, which is what makes CI reproducible — and
  # also means nothing ever tests against newer dependencies. This job closes
  # that blind spot: it updates the lock file in the runner (never committed)
  # and runs the suite against whatever resolves today. It is how a
  # semver-compatible upstream release that breaks us gets found on a Monday
  # rather than by a contributor mid-task.
  #
  # Scheduled/manual only, so it can never block a PR — a failure here is a
  # notification, not a gate. GitHub emails the workflow's last editor when a
  # scheduled run fails, which is the intended signal.
  #
  # Deliberately uncached: restoring a `target` built against the *old* lock
  # file would undercut the point of resolving fresh.
  fresh-deps:
    name: fresh deps (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      # `resolver = "3"` makes this MSRV-aware, so it won't pull dependencies
      # that need a newer rustc than `rust-version = "1.85.0"` — an update that
      # passes here shouldn't break the msrv job.
      - name: Update dependencies
        run: cargo update

      - name: Show what moved
        run: git --no-pager diff --stat -- Cargo.lock

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Test (all features)
        run: cargo test --workspace --all-features

  # Supply-chain policy, enforced against the committed lock file: RustSec
  # advisories, and a permissive-only licence allow-list (see `deny.toml`, which
  # carries the rationale for each knob).
  #
  # Runs on every event, unlike `fresh-deps`. Two different failure modes matter:
  # a PR that *adds* a vulnerable or copyleft dependency should be blocked at
  # review time, and the weekly schedule catches an advisory published against a
  # dependency that hasn't changed — the tree can go red without a single commit,
  # which is the whole point of an advisory database.
  #
  # Linux-only: the licence and advisory graph is platform-independent, and
  # `deny.toml` pins the five target triples explicitly so the result doesn't
  # depend on which runner evaluates it.
  deny:
    name: cargo-deny (advisories + licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lint:
    name: fmt + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      # The docs lean hard on intra-doc links (`[`QosClass`]`, `[`crate::apply`]`);
      # this catches broken ones, which `cargo build` does not.
      - name: Docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps --locked
