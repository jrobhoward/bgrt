[package]
name = "bgrt-bench"
description = "Comparison harness: time, core placement, frequency, and power across bgrt executors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bgrt = { workspace = true, features = ["telemetry", "tokio"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Cache-bypassing reads for the disk workload: O_DIRECT / F_NOCACHE / fadvise.
libc = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
