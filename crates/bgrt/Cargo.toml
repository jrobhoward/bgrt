[package]
name = "bgrt"
description = "Run async tasks and threads at a low energy footprint: efficiency cores, low clock, no fan spin-up."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Without this, docs.rs builds with default features only and the `rayon` and
# `telemetry` APIs are absent from the published documentation entirely.
[package.metadata.docs.rs]
all-features = true

[features]
# tokio is on by default: `RuntimeBuilder`/`Runtime` require it.
# Disable with `default-features = false` to get a lean dep tree when you
# only need `spawn_thread`/`ThreadBuilder`/`apply`.
default = ["tokio"]
tokio = ["dep:tokio"]

# rayon integration: `RayonBuilder`/`RayonPool` for quiet parallel iterators.
# Off by default; opt in with `features = ["rayon"]`.
rayon = ["dep:rayon"]

# Measurement primitives for the comparison harness (core placement, frequency,
# energy). Off by default so the default build stays lean; pulls in no extra
# dependencies (uses the platform `libc`/`windows-sys` already present).
telemetry = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
# `sync` is for the oneshot channel that signals shutdown to the dedicated
# driver thread behind `RuntimeBuilder::current_thread`.
tokio = { workspace = true, optional = true, features = ["sync"] }
rayon = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[[example]]
name = "background_task"
required-features = ["tokio"]

[[example]]
name = "mixed_runtimes"
required-features = ["tokio"]
